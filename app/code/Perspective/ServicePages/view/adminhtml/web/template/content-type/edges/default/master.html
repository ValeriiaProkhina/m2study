<section attr="data.main.attributes" css="data.main.css" ko-style="data.main.style" id="section-advantages"
         class="_common-section service-single__section service-single__section--advantages service-single__section--advantages-pagebuilder ">

    <!-- ko if: data.main.attributes()['section-name'] -->
    <div class="service-single__label _section-label" data-bind="text: data.main.attributes()['section-name']"></div>
    <!--    /ko -->


    <div class="service-single__content service-single__content--wide">
        <!-- ko if: data.main.attributes()['title'] -->
        <h2 class="h3 service-single__title" data-bind="text: data.main.attributes()['title']"></h2>
        <!-- /ko-->

        <!-- ko if: data.main.attributes()['data-items'] -->
        <ul class="service-single__squares service-table-squares service-table-squares-3col"
            data-bind="foreach:{ data: JSON.parse(data.main.attributes()['data-items']), as: 'item' }">
            <li class="service-table-squares__item">
                <div class="service-square-item__body">
                    <!-- ko if: item.image && item.image[0] && item.image[0].url -->
                    <div class="service-square-item__image">
                        <img data-bind="attr: { src : item.image[0].url, alt: item.title }" />
                    </div>
                    <!-- /ko -->

                    <!-- ko if: item.title -->
                    <h3 class="service-square-item__title h4" style="text-transform: none" text="item.title"></h3>
                    <!-- /ko -->
                    <!-- ko if: item.content -->
                    <p class="service-square-item__text" style="text-transform: none" html="item.content"></p>
                    <!-- /ko -->

                </div>
            </li>
        </ul>
        <!-- /ko -->
    </div>
</section>
