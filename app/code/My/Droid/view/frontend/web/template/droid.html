<div class="droid-block">

    <!-- === ko.observable === -->
    
    <h3 class="droid-block__title">
        <span data-bind="text: $t('Droid: ')"></span>
        <strong data-bind="text: droidName"></strong>
    </h3>

    <p class="droid-block__welcome" data-bind="text: welcomeMessage"></p>

    <!-- === ko.computed === -->
    
    <p class="droid-block__status" data-bind="visible: statusLabel, text: statusLabel"></p>
    <p class="droid-block__count"
       data-bind="text: $t('Active missions: %1').replace('%1', missionCount())">
    </p>

    <!-- === click binding + ko.observable setter === -->
    <div class="droid-block__actions">
        <button class="action primary" data-bind="click: changeName">
            <span data-bind="text: $t('Change Droid Name')"></span>
        </button>

        
        <button class="action secondary" data-bind="click: addMission">
            <span data-bind="text: $t('Add Mission')"></span>
        </button>
    </div>

    <!-- === ko.observableArray + foreach === -->
    
    <ul class="droid-block__missions" data-bind="foreach: missions">
        <li class="droid-block__mission-item">
            <span class="droid-block__mission-id"   data-bind="text: '#' + id"></span>
            <span class="droid-block__mission-title" data-bind="text: title"></span>

            
            <button class="droid-block__remove"
                    data-bind="click: $parent.removeMission.bind($parent, $data)"
                    title="Remove">✕</button>
        </li>
    </ul>

    
    <!-- ko if: missions().length === 0 -->
    <p class="droid-block__empty" data-bind="text: $t('No active missions.')"></p>
    <!-- /ko -->

</div>
