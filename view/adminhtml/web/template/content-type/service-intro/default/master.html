<section attr="data.main.attributes" css="data.main.css" ko-style="data.main.style">

    <div class="service-page__top _grid-3-col">
        <!-- ko if: data.main.attributes()['title'] -->
        <h1 class="h2 services-page__title" data-bind="text: data.main.attributes()['title']"></h1>
        <!-- /ko -->
        <!--   ko if: data.main.attributes()['src'] -->
        <div class="optimization-page-intro__image optimization-page-intro__image--mobile">
            <img data-bind="attr: { src: data.main.attributes()['src'], alt: data.main.attributes()['image_alt'] }"/>
        </div>
        <!--    /ko -->
    </div>
    <div class="service-single__optimization optimization-page-intro__pre _grid-3-col">
        <div class="empty"></div>

        <div class="optimization-page-intro__col">
            <!-- ko if: data.main.attributes()['description-one'] -->
            <p class="h4" data-bind="text: data.main.attributes()['description-one']"></p>
            <!-- /ko -->
        </div>
    </div>
    <div class="service-single__optimization optimization-page-intro _grid-3-col">
        <div class="empty"></div>

        <div class="optimization-page-intro__col mt-md-16">
            <!-- ko if: data.main.attributes()['description-two'] -->
            <p class="h4" data-bind="text: data.main.attributes()['description-two']"></p>
            <!-- /ko -->

            <!-- ko if: data.main.attributes()['description'] -->
            <p class="h4" data-bind="text: data.main.attributes()['description']"></p>
            <!-- /ko -->
            <a
                href="#footer"
                class="_button _button--orange-bg _scrollTo optimization-page-intro__button--dt"
                style="max-width: 230px"
            >
                <!-- ko if: data.main.attributes()['btn-text'] -->
                <h5 class="h5 _button__text" data-bind="text: data.main.attributes()['btn-text']"></h5>
                <!-- /ko -->
                <!-- ko ifnot: data.main.attributes()['btn-text'] -->
                <h5 class="h5 _button__text" data-bind="i18n: 'Let’s do it!'"></h5>
                <!-- /ko -->
                <span class="_button__overlay _button__overlay--hover"></span>
                <span class="_button__overlay _button__overlay--active"></span>
            </a>
        </div>
        <!--ko if: data.main.attributes()['src']-->
        <div class="optimization-page-intro__col">
            <div class="optimization-page-intro__image optimization-page-intro__image--dt">
                <img
                    data-bind="attr: { src: data.main.attributes()['src'], alt: data.main.attributes()['image_alt'] }"/>
            </div>
        </div>
        <!-- /ko-->
        <a href="#footer" class="_button _button--orange-bg _scrollTo optimization-page-intro__button--mobile">
            <!-- ko if: data.main.attributes()['btn-text'] -->
            <h5 class="h5 _button__text" data-bind="text: data.main.attributes()['btn-text']"></h5>
            <!-- /ko -->
            <!-- ko ifnot: data.main.attributes()['btn-text'] -->
            <h5 class="h5 _button__text" data-bind="i18n: 'Let’s do it!'"></h5>
            <!-- /ko -->
            <span class="_button__overlay _button__overlay--hover"></span>
            <span class="_button__overlay _button__overlay--active"></span>
        </a>
    </div>
</section>
